[package]
name = "fea_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Direct Stiffness Method FEA solver for The Teardown Lab"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
